services:

    # The reader no longer needs Doctrine's annotation reader: Symfony 7 dropped the
    # "annotations.reader" service, and attributes only require reflection.
    Jul6Art\PushBundle\Attribute\AsyncAttributeReader: ~

    Jul6Art\PushBundle\Attribute\Interfaces\AsyncAttributeReaderInterface: '@Jul6Art\PushBundle\Attribute\AsyncAttributeReader'

    Jul6Art\PushBundle\Dispatcher\AsyncDispatcher:
        calls:
            - setBus: ['@messenger.default_bus']

    Jul6Art\PushBundle\Dispatcher\Interfaces\AsyncDispatcherInterface: '@Jul6Art\PushBundle\Dispatcher\AsyncDispatcher'

    Jul6Art\PushBundle\EventListener\AsyncEventListener:
        parent: Jul6Art\CoreBundle\EventListener\AbstractEventListener
        calls:
            - setAsyncAttributeReader: ['@Jul6Art\PushBundle\Attribute\Interfaces\AsyncAttributeReaderInterface']
            - setAsyncDispatcher: ['@Jul6Art\PushBundle\Dispatcher\Interfaces\AsyncDispatcherInterface']
        tags:
            - { name: doctrine.event_listener, event: postLoad, method: postLoad }
            - { name: doctrine.event_listener, event: postPersist, method: postPersist }
            - { name: doctrine.event_listener, event: postUpdate, method: postUpdate }
            - { name: doctrine.event_listener, event: preRemove, method: preRemove }

    Jul6Art\PushBundle\MessageHandler\EntityAsyncEventHandler:
        calls:
            - setAsyncAttributeReader: ['@Jul6Art\PushBundle\Attribute\Interfaces\AsyncAttributeReaderInterface']
            - setEntityManager: ['@doctrine.orm.entity_manager']
            - setEventDispatcher: ['@event_dispatcher']
        tags:
            - { name: messenger.message_handler }

    Jul6Art\PushBundle\Service\Pusher:
        arguments:
            - '%push.async%'
            - '%push.enabled%'
        calls:
            - setBus: ['@messenger.default_bus']
            # HubInterface replaces the deprecated PublisherInterface alias.
            - setHub: ['@Symfony\Component\Mercure\HubInterface']
